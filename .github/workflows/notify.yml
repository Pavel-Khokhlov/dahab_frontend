name: Notify

on:
  workflow_call:
    inputs:
      deploy_result:
        required: true
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        run: |
          DEPLOY="${{ inputs.deploy_result }}"
    
          if [ "$DEPLOY" != "success" ]; then
            TEXT="❌ Deploy failure%0A${{ github.repository }} @ ${{ github.ref_name }}%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.          run_id }}"
          else
            TEXT="✅ Deploy successful%0A${{ github.repository }} @ ${{ github.ref_name }}%0AActor: ${{ github.actor }}%0AVersion: sha-${{ github.sha }}"
          fi
    
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=$TEXT" \
              -d "disable_web_page_preview=true")

            echo "$RESPONSE"
            echo "$RESPONSE" | grep -q '"ok":true' || { echo "Telegram API rejected"; exit 1; }