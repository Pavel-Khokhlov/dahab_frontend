name: PR Checks

on:
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: "Security scan"
    uses: ./.github/workflows/sast-sca.yaml
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
        include:
          - node-version: 24
            experimental: true

      fail-fast: false
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node-version }}-
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      # - name: Starting tests
      #   run: npm run test
