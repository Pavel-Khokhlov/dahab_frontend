frontend:
  name: frontend
  image:
    repository: pavelkh09/dahab-front
  port: 80
  replicaCount: 2          # single-node
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "128Mi"

ingress:
  host: dahab.family-freediving.ru
  tlsSecret: app-tls
  clusterIssuer: letsencrypt-prod

# SOFT: HPA требует metrics-server. По умолчанию выключен, иначе бесполезен без метрик.
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  cpuUtilization: 70

# SOFT: ServiceMonitor требует CRD monitoring.coreos.com (kube-prometheus-stack).
# По умолчанию выключен, иначе ArgoCD-синк уходит в Degraded (нет CRD).
monitoring:
  enabled: false
  release: kube-prometheus-stack